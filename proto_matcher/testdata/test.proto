syntax = "proto3";

package proto_matcher;


message Foo {
    repeated Bar bars = 1;
    Baz baz = 2;
    map<int32, string> mapping = 3;
}

message Bar {
    oneof id {
      int32 short_id = 1;
      int64 long_id = 2;
    }
    string name = 3;
    string description = 4;
    uint32 size = 5;
    float progress = 6;
    double precision = 7;
    bool checked = 8;
    repeated string notes = 9;
}

message Baz {
  enum Status {
    STATUS_UNSPECIFITED = 0;
    OK = 1;
    ERROR = 2;
  }
  Status status = 1;
}

// A SELF-REFERENTIAL message: `list_of` is itself a TypeInfo. This is the shape real
// schemas use to model nested types (`list<list<int>>`), so the cycle is legitimate and
// permanent -- it cannot be designed away. It exists here to pin the comparison walk's
// termination behaviour.
message TypeInfo {
  oneof type {
    string single_type = 1;
    TypeInfo list_of = 2;
  }
}

// Holds a TypeInfo the way a real schema holds one: as an ordinary singular field that is
// very often UNSET. Comparing two of these must not depend on TypeInfo's depth.
message Typed {
  string name = 1;
  TypeInfo type = 2;
}
